<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="Voicela on macOS — laptop tile illustration">
  <title>Voicela · macOS platform tile</title>
  <defs>
    <linearGradient id="mac-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F4"/>
      <stop offset="1" stop-color="#F5F5F2"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#mac-bg)"/>

  <!-- aluminum casing -->
  <rect x="116" y="88" width="408" height="252" rx="18" fill="#E8EAEE" stroke="#D4D8DD" stroke-width="1.5"/>
  <!-- notch -->
  <rect x="298" y="90" width="44" height="14" rx="7" fill="#17191C"/>
  <!-- display -->
  <rect x="130" y="106" width="380" height="222" rx="10" fill="#F7F8FA" stroke="#E4E7EA" stroke-width="1"/>

  <!-- status/menu line -->
  <rect x="146" y="116" width="120" height="7" rx="3.5" fill="#E4E7EA"/>
  <rect x="430" y="116" width="60" height="7" rx="3.5" fill="#E4E7EA"/>

  <!-- main document window -->
  <rect x="148" y="140" width="196" height="120" rx="10" fill="#FFFFFF" stroke="#D9DCDF" stroke-width="1.2"/>
  <g>
    <circle cx="160" cy="152" r="3.5" fill="#D9DCDF"/>
    <circle cx="172" cy="152" r="3.5" fill="#D9DCDF"/>
    <circle cx="184" cy="152" r="3.5" fill="#3869DC"/>
  </g>
  <g fill="#E4E7EA">
    <rect x="148" y="168" width="176" height="8" rx="4"/>
    <rect x="148" y="184" width="140" height="8" rx="4"/>
    <rect x="148" y="200" width="160" height="8" rx="4"/>
  </g>
  <rect x="148" y="222" width="126" height="24" rx="8" fill="#EAF0FF"/>
  <rect x="158" y="232" width="84" height="5" rx="2.5" fill="#3869DC" opacity="0.85"/>

  <!-- floating assistant card -->
  <rect x="288" y="212" width="182" height="90" rx="12" fill="#EAF0FF" stroke="#C7D4F0" stroke-width="1.2"/>
  <circle cx="308" cy="257" r="7" fill="#3869DC"/>
  <rect x="324" y="238" width="120" height="7" rx="3.5" fill="#3869DC" opacity="0.7"/>
  <rect x="324" y="252" width="96" height="7" rx="3.5" fill="#3869DC" opacity="0.4"/>
  <rect x="324" y="268" width="112" height="12" rx="4" fill="#FFFFFF"/>

  <!-- dock -->
  <g>
    <rect x="224" y="306" width="20" height="20" rx="6" fill="#D4D8DD"/>
    <rect x="250" y="306" width="20" height="20" rx="6" fill="#3869DC"/>
    <rect x="276" y="306" width="20" height="20" rx="6" fill="#D4D8DD"/>
  </g>

  <!-- front base / lip -->
  <rect x="104" y="348" width="432" height="16" rx="8" fill="#E8EAEE" stroke="#D4D8DD" stroke-width="1.5"/>
  <rect x="276" y="350" width="88" height="12" rx="6" fill="#D9DCDF"/>

  <text x="36" y="432" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.22em" fill="#6B7078">PLATFORM·MACOS</text>
  <text x="36" y="456" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#17191C">Planned · after Windows</text>
</svg>
