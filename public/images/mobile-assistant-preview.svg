<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="Voicela mobile assistant concept — phone mockup">
  <title>Voicela mobile assistant concept</title>
  <defs>
    <linearGradient id="ma-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F4"/>
      <stop offset="1" stop-color="#F5F5F2"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#ma-bg)"/>

  <rect x="402" y="148" width="6" height="42" rx="3" fill="#6B7078"/>
  <rect x="232" y="128" width="6" height="52" rx="3" fill="#6B7078"/>

  <!-- body -->
  <rect x="240" y="60" width="160" height="360" rx="36" fill="#111318"/>
  <rect x="252" y="72" width="136" height="336" rx="26" fill="#F7F8FA" stroke="#E4E7EA" stroke-width="1"/>
  <rect x="296" y="82" width="48" height="15" rx="7.5" fill="#17191C"/>

  <!-- greeting -->
  <text x="266" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6B7078">Good evening</text>
  <text x="266" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="650" fill="#17191C">What do you need?</text>

  <!-- command card -->
  <rect x="264" y="152" width="112" height="56" rx="10" fill="#FFFFFF" stroke="#D9DCDF" stroke-width="1.2"/>
  <text x="274" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#3869DC">“</text>
  <g fill="#E4E7EA">
    <rect x="288" y="178" width="74" height="7" rx="3.5"/>
    <rect x="288" y="192" width="60" height="7" rx="3.5"/>
  </g>

  <!-- plan card -->
  <rect x="264" y="218" width="112" height="120" rx="12" fill="#FFFFFF" stroke="#D9DCDF" stroke-width="1.2"/>
  <text x="274" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" letter-spacing="0.18em" fill="#6B7078">PLAN</text>
  <g>
    <rect x="274" y="246" width="18" height="18" rx="5" fill="#EAF0FF"/>
    <path d="M278 255 l3 3 l5 -6" fill="none" stroke="#3869DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="300" y="250" width="66" height="6" rx="3" fill="#E4E7EA"/>
    <rect x="274" y="276" width="18" height="18" rx="5" fill="#EAF0FF"/>
    <path d="M278 285 l3 3 l5 -6" fill="none" stroke="#3869DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="300" y="280" width="58" height="6" rx="3" fill="#E4E7EA"/>
    <rect x="274" y="306" width="18" height="18" rx="5" fill="#EAF0FF"/>
    <path d="M278 315 l3 3 l5 -6" fill="none" stroke="#3869DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="300" y="310" width="70" height="6" rx="3" fill="#E4E7EA"/>
  </g>

  <!-- recording pill -->
  <rect x="272" y="350" width="96" height="36" rx="18" fill="#FFFFFF" stroke="#D9DCDF" stroke-width="1.2"/>
  <g fill="#3869DC">
    <rect x="296" y="360" width="4" height="8" rx="2"/>
    <rect x="304" y="356" width="4" height="16" rx="2"/>
    <rect x="312" y="352" width="4" height="24" rx="2"/>
    <rect x="320" y="356" width="4" height="16" rx="2"/>
    <rect x="328" y="360" width="4" height="8" rx="2"/>
  </g>
  <text x="338" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6B7078">ready</text>

  <rect x="300" y="380" width="40" height="5" rx="2.5" fill="#B9C0C9"/>

  <text x="436" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.2em" fill="#6B7078">DEMO·MOBILE</text>
  <text x="436" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#17191C">Assistant concept</text>
  <rect x="436" y="258" width="72" height="5" rx="2.5" fill="#3869DC"/>
  <text x="436" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#6B7078">Speak, review the plan,</text>
  <text x="436" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#6B7078">then act. Mobile mockup.</text>
</svg>
